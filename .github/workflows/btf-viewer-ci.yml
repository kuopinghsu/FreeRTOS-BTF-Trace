name: BTF Viewer CI

on:
  push:
    paths:
      - 'BTFViewer/**'
      - 'tracedata/**'
      - '.github/workflows/btf-viewer-ci.yml'
  pull_request:
    paths:
      - 'BTFViewer/**'
      - 'tracedata/**'
      - '.github/workflows/btf-viewer-ci.yml'

jobs:
  desktop:
    name: Desktop tests + bundle freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PySide6
        run: pip install -r BTFViewer/requirements.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon0

      - name: Desktop unit tests (includes Desktop↔Web parity)
        run: make -C BTFViewer test

      - name: Generated desktop bundle freshness
        run: make -C BTFViewer check-bundle

  web:
    name: Web tests + HTML freshness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BTFViewer/web
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Node 22 matches local release builds for reproducible builds/btf_viewer.html.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Generated web HTML freshness
        working-directory: BTFViewer
        run: make check-web

  docs-gate:
    name: Docs links, parity, PDF freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Documentation links, EN/zh-TW parity, PDF freshness
        run: make -C BTFViewer check-docs
