name: BTF Viewer CI

on:
  push:
    paths:
      - 'BTFViewer/**'
      - 'tracedata/**'
      - '.github/workflows/btf-viewer-ci.yml'
  pull_request:
    paths:
      - 'BTFViewer/**'
      - 'tracedata/**'
      - '.github/workflows/btf-viewer-ci.yml'
  release:
    types: [published]

jobs:
  desktop:
    name: Desktop tests + bundle freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PySide6
        run: pip install -r BTFViewer/requirements.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon0

      - name: Desktop unit tests (includes Desktop↔Web parity)
        run: make -C BTFViewer test

      - name: Generated desktop bundle freshness
        run: make -C BTFViewer check-bundle

  web:
    name: Web tests + HTML freshness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BTFViewer/web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node 22 matches local release builds for reproducible builds/btf_viewer.html.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Generated web HTML freshness
        working-directory: BTFViewer
        run: make check-web

      - name: Eclipse plug-in packaged resource freshness
        working-directory: BTFViewer
        run: make check-eclipse-resources

  docs-gate:
    name: Docs links, parity, PDF freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Documentation links, EN/zh-TW parity, PDF freshness
        run: make -C BTFViewer check-docs

      - name: Validate release package and ChangeLog
        if: github.event_name != 'release'
        working-directory: BTFViewer
        run: |
          version=$(python -c 'import json; from pathlib import Path; print(json.loads(Path("web/package.json").read_text(encoding="utf-8"))["version"])')
          python scripts/package_release.py "v$version" "$RUNNER_TEMP/btf-release-check"

  release:
    name: Package published BTFViewer release
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: [desktop, web, docs-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify installation from the packaged Eclipse update site
        shell: bash
        run: |
          sdk_url=https://archive.eclipse.org/eclipse/downloads/drops4/R-4.34-202411201800
          sdk_archive=eclipse-SDK-4.34-linux-gtk-x86_64.tar.gz
          sdk_sha512=5d0de0a777c6ecf3d0555f8fed43b94d5f8f800a2d7500776cd94c3db77a0ab276fa95d6b606e6a90a4c7ae5a8aab6a76d7c5cfbc3d79f324f3ecd67c585ed7b
          curl --fail --silent --show-error --location --retry 3 "$sdk_url/$sdk_archive" -o "$RUNNER_TEMP/$sdk_archive"
          printf '%s  %s\n' "$sdk_sha512" "$RUNNER_TEMP/$sdk_archive" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/$sdk_archive" -C "$RUNNER_TEMP"
          eclipse_home="$RUNNER_TEMP/eclipse"
          sites=("$GITHUB_WORKSPACE/BTFViewer/builds"/com.btfviewer.eclipse_*-p2.zip)
          if [[ ${#sites[@]} -ne 1 || ! -f ${sites[0]} ]]; then
            echo "::error::Expected one Eclipse installer ZIP."
            exit 1
          fi
          "$eclipse_home/eclipse" -vm "$JAVA_HOME/bin/java" -nosplash -consoleLog -data @none \
            -application org.eclipse.equinox.p2.director \
            -repository "jar:file:${sites[0]}!/" \
            -installIU com.btfviewer.eclipse.feature.feature.group

      - name: Upload release packages and publish notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python BTFViewer/scripts/package_release.py "$RELEASE_TAG" "$RUNNER_TEMP/btf-release"
          for asset_path in "$RUNNER_TEMP/btf-release/btf_viewer_$RELEASE_TAG.zip" \
            BTFViewer/builds/com.btfviewer.eclipse_*-p2.zip; do
            asset_name=${asset_path##*/}
            checksum=$(sha256sum "$asset_path")
            digest="sha256:${checksum%% *}"
            existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              | jq -r --arg name "$asset_name" --arg digest "$digest" '
                  .[] | select(.name == $name)
                  | if .state == "uploaded" and .digest == $digest then "match" else "conflict" end')
            case "$existing" in
              '') gh release upload "$RELEASE_TAG" "$asset_path" ;;
              match) echo "Release already contains $asset_name with the expected SHA-256." ;;
              *) echo "::error::Existing release asset $asset_name could not be verified. It was left in place."; exit 1 ;;
            esac
          done
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/btf-release/release-notes.md"
