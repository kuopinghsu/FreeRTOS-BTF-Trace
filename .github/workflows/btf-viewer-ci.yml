name: BTF Viewer CI

on:
  push:
    paths:
      - 'BTFViewer/**'
      - 'tracedata/**'
      - '.github/workflows/btf-viewer-ci.yml'
  pull_request:
    paths:
      - 'BTFViewer/**'
      - 'tracedata/**'
      - '.github/workflows/btf-viewer-ci.yml'
  release:
    types: [published]

jobs:
  desktop:
    name: Desktop tests + bundle freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PySide6
        run: pip install -r BTFViewer/requirements.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon0

      - name: Desktop unit tests (includes Desktop↔Web parity)
        run: make -C BTFViewer test

      - name: Generated desktop bundle freshness
        run: make -C BTFViewer check-bundle

  web:
    name: Web tests + HTML freshness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BTFViewer/web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node 22 matches local release builds for reproducible builds/btf_viewer.html.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Generated web HTML freshness
        working-directory: BTFViewer
        run: make check-web

      - name: Eclipse plug-in packaged resource freshness
        working-directory: BTFViewer
        run: make check-eclipse-resources

  docs-gate:
    name: Docs links, parity, PDF freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Documentation links, EN/zh-TW parity, PDF freshness
        run: make -C BTFViewer check-docs

  release:
    name: Package published BTFViewer release
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: [desktop, web, docs-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Package viewer and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python BTFViewer/scripts/package_release.py "$RELEASE_TAG" "$RUNNER_TEMP/btf-release"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/btf-release/btf_viewer_$RELEASE_TAG.zip" --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/btf-release/release-notes.md"
