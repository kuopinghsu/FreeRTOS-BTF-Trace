name: BTF Viewer bundle check

on:
  push:
    paths:
      - 'BTFViewer/btf_viewer_pkg/**'
      - 'BTFViewer/scripts/bundle_viewer.py'
      - 'BTFViewer/Makefile'
  pull_request:
    paths:
      - 'BTFViewer/btf_viewer_pkg/**'
      - 'BTFViewer/scripts/bundle_viewer.py'
      - 'BTFViewer/Makefile'

jobs:
  check-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PySide6
        run: pip install -r BTFViewer/requirements.txt

      - name: Verify bundled builds/btf_viewer.py matches package
        run: make -C BTFViewer check-bundle
