<svg xmlns="http://www.w3.org/2000/svg" width="500" height="520" viewBox="0 0 500 520" role="img" aria-label="Top-Down Analysis Ladder">
  <rect x="20" y="10" width="460" height="500" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="250" y="42" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Top-Down Analysis Ladder</text>

  <rect x="50" y="60" width="400" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="250" y="80" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f5132">① System Health</text>
  <text x="250" y="98" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Trace Health (TICK), span, instrumentation flags</text>

  <line x1="250" y1="110" x2="250" y2="128" stroke="#64748b" stroke-width="2"/>

  <rect x="50" y="128" width="400" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="250" y="148" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0c5460">② Core Balance</text>
  <text x="250" y="166" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Core Utilisation + Load Balance Score</text>
  <text x="250" y="182" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-style="italic" fill="#1e293b">→ Core Time Breakdown / Concurrent Core Active / Switch Overhead</text>

  <line x1="250" y1="188" x2="250" y2="206" stroke="#64748b" stroke-width="2"/>

  <rect x="50" y="206" width="400" height="50" rx="8" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
  <text x="250" y="226" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#664d03">③ Task CPU / WCET</text>
  <text x="250" y="244" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Top Tasks → Execution Time Per Slice (Max)</text>

  <line x1="250" y1="256" x2="250" y2="274" stroke="#64748b" stroke-width="2"/>

  <rect x="50" y="274" width="400" height="50" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="250" y="294" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#6e2a00">④ Latency</text>
  <text x="250" y="312" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Blocking Time → Dispatch Latency → Preemption Chain</text>

  <line x1="250" y1="324" x2="250" y2="342" stroke="#64748b" stroke-width="2"/>

  <rect x="50" y="342" width="400" height="60" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="250" y="362" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#842029">⑤ Concurrency</text>
  <text x="250" y="380" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Core Migrations → Mutex/Semaphore → Priority Inheritance</text>
  <text x="250" y="396" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-style="italic" fill="#1e293b">→ Heatmap / Chord inspector (corridors, lock-bounce)</text>

  <line x1="250" y1="402" x2="250" y2="420" stroke="#64748b" stroke-width="2"/>

  <rect x="50" y="420" width="400" height="50" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="250" y="440" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#4a148c">⑥ Compliance</text>
  <text x="250" y="458" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Deadlines / Affinity / Task Lifecycle / Tags / Intervals</text>

  <text x="250" y="494" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#64748b">Stop at the first rung that explains the symptom.</text>
</svg>
